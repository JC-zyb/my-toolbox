[package]
name = "my-toolbox"
version = "0.1.0"
description = "个人工具箱与本地 Agents 工作台"
edition = "2021"
default-run = "my-toolbox"

[lib]
name = "toolbox_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "my-toolbox"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inspect-usage"
path = "src/bin/inspect_usage.rs"

[[bin]]
name = "skills-fixture"
path = "src/bin/skills_fixture.rs"

[[bin]]
name = "local-tools-fixture"
path = "src/bin/local_tools_fixture.rs"

[[bin]]
name = "inspect-local-tools"
path = "src/bin/inspect_local_tools.rs"

[[bin]]
name = "local-tools-smoke"
path = "src/bin/local_tools_smoke.rs"

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "=0.20.2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"
